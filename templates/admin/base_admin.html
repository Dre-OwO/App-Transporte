<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo if titulo else "Admin Transporte" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header class="admin-header">
    <div class="header-row">
      <div>
        <h1>Backoffice de administracion</h1>
        <div class="header-note">Area separada para gestion del sistema y futuras operaciones CRUD</div>
      </div>
      <a class="public-link" href="{{ url_for('inicio') }}">Volver al sitio publico</a>
    </div>
    <nav class="nav">
      <a href="{{ url_for('admin') }}">Dashboard</a>
      <a href="{{ url_for('admin_usuarios') }}">Usuarios</a>
      <a href="{{ url_for('admin_planes') }}">Planes</a>
      <a href="{{ url_for('admin_suscripciones') }}">Suscripciones</a>
      <a href="{{ url_for('admin_reportes') }}">Reportes</a>
    </nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
