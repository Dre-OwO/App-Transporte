{% extends "public/base_public.html" %}
{% block contenido %}
<section class="content-grid">
  <div class="box">
    <h2 class="page-title">Registro</h2>
    <form>
      <label>Nombre completo</label>
      <input type="text" placeholder="Nombre Apellido">

      <label>Correo</label>
      <input type="email" placeholder="correo@ejemplo.com">

      <label>Telefono</label>
      <input type="text" placeholder="33xxxxxxx">

      <label>Contrasena</label>
      <input type="password" placeholder="********">

      <button type="button">Registrarse</button>
    </form>
  </div>
  <div class="box">
    <h3>Nota de esta fase</h3>
    <p>El formulario aun no guarda datos. Solo deja lista la pantalla para conectarla a la base de datos despues.</p>
  </div>
</section>
{% endblock %}
