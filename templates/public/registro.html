{% extends "public/base_public.html" %}
{% block contenido %}
<section class="content-grid">
  <div class="box">
    <h2 class="page-title">Registro de usuario</h2>
    <form method="post">
      <label>Nombre completo</label>
      <input name="nombre" type="text" value="{{ form_data.nombre }}" placeholder="Nombre Apellido">

      <label>Correo</label>
      <input name="correo" type="email" value="{{ form_data.correo }}" placeholder="correo@ejemplo.com">

      <label>Telefono</label>
      <input name="telefono" type="text" value="{{ form_data.telefono }}" placeholder="33xxxxxxx">

      <label>Contrasena</label>
      <input name="password" type="password" placeholder="********">

      <button type="submit">Crear usuario</button>
    </form>
  </div>
  <div class="box">
    <h3>Que hace esta vista</h3>
    <ul>
      <li>Crea documentos reales en la coleccion <code>usuarios</code>.</li>
      <li>Registra el usuario con rol <code>cliente</code>.</li>
      <li>Deja el correo listo para consultarlo desde el panel de usuario.</li>
    </ul>
  </div>
</section>
{% endblock %}
